name: Deploy 青智焕新 to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qingzhi-cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Verify Cloudflare account
        run: npx wrangler whoami
      - name: Validate and install application secrets
        env:
          APP_ACCESS_PASSWORD: ${{ secrets.APP_ACCESS_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const keys = ['APP_ACCESS_PASSWORD','DEEPSEEK_API_KEY','MINIMAX_API_KEY', 'R2_ENDPOINT_URL', 'R2_BUCKET_NAME', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY'];
          const values = Object.fromEntries(keys.map(key => [key, process.env[key] || '']));
          if (values.APP_ACCESS_PASSWORD.length < 24 || keys.some(key => !values[key])) {
            throw new Error('Configure all seven application secrets; access password requires 24+ characters.');
          }
          const result = spawnSync(process.execPath, ['node_modules/wrangler/bin/wrangler.js','secret','bulk'], {
            input: JSON.stringify(values), stdio:['pipe','inherit','inherit']
          });
          process.exit(result.status ?? 1);
          JS
      - name: Deploy Worker and container
        run: npm run deploy
